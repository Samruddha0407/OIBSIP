<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Samruddha">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="converter-card">
        <div class="header">
            <h1>Temperature Converter</h1>
            <p>Enter a value to see real-time conversions.</p>
        </div>
        
        <div class="input-container">
            <div class="input-group">
                <label for="celsius">Celsius (°C)</label>
                <input type="number" id="celsius" placeholder="e.g. 25">
            </div>
            
            <div class="input-group">
                <label for="fahrenheit">Fahrenheit (°F)</label>
                <input type="number" id="fahrenheit" placeholder="e.g. 77">
            </div>
            
            <div class="input-group">
                <label for="kelvin">Kelvin (K)</label>
                <input type="number" id="kelvin" placeholder="e.g. 298.15">
            </div>
        </div>
        
        <div class="footer">
            <button id="clear-btn">Clear All</button>
            <p class="author-credit">Designed by <strong>Samruddha</strong></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
